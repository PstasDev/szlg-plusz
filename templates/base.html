<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}SZLG+{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f2f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 28rem); background: white; border: 1px solid #dce3ec; border-radius: 1rem; padding: clamp(1.5rem, 5vw, 2.5rem); box-shadow: 0 1rem 3rem #15244312; }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    p { color: #566176; line-height: 1.55; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input { box-sizing: border-box; width: 100%; border: 1px solid #bac5d4; border-radius: .55rem; padding: .75rem; font: inherit; }
    button, .button { display: inline-block; width: 100%; border: 0; border-radius: .55rem; padding: .8rem 1rem; margin-top: 1rem; background: #1757b8; color: white; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; box-sizing: border-box; }
    button.secondary { background: #e8eef7; color: #1e3558; }
    button.danger { width: auto; background: #9d2b36; }
    .muted { font-size: .92rem; color: #667085; }
    .error { padding: .8rem; border-radius: .5rem; color: #842029; background: #f8d7da; }
    .success { padding: .8rem; border-radius: .5rem; color: #0f5132; background: #d1e7dd; }
    .divider { margin: 1.5rem 0; border: 0; border-top: 1px solid #e5e9f0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .row form { margin: 0; }
    .row button { margin: 0; }
    ul { padding-left: 1.25rem; }
    li { margin: .6rem 0; }
    :focus-visible { outline: 3px solid #7aaeff; outline-offset: 2px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main>
    <header>
      <h1><a href="{% url 'login' %}" style="color:inherit;text-decoration:none">SZLG+</a></h1>
      <p class="muted">Biztonságos iskolai bejelentkezés</p>
    </header>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
