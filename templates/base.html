<!doctype html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}SZLG+{% endblock %}</title>
  {% load static %}
  <script>
    try {
      if (localStorage.getItem("szlg-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell {% block shell_class %}{% endblock %}">
    <div class="card">
      <div class="head">
        <a class="brand" href="{% url 'login' %}" aria-label="SZLG+ kezdőlap">
          <span class="crest" aria-hidden="true"></span>
          <span class="brand-name">SZLG+</span>
        </a>
        {% block head_text %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <span>Kőbányai Szent László Gimnázium</span>
      <button type="button" class="btn text" id="theme-toggle">Világos mód</button>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById("theme-toggle");
      function label() { button.textContent = root.getAttribute("data-theme") === "light" ? "Sötét mód" : "Világos mód"; }
      label();
      button.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("szlg-theme", next); } catch (e) {}
        label();
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
