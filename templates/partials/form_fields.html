{% for error in form.non_field_errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}
{% for field in form %}
  <div class="fld{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="hint">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
