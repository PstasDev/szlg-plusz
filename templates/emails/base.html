<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block document_title %}SZLG+{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f7f8f4; color:#102a2b; font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">{% block preview_text %}{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background-color:#f7f8f4;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" width="680" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:680px; background-color:#ffffff; border:1px solid #e5e7e3; border-radius:14px; overflow:hidden;">
          <tr>
            <td style="padding:28px 36px; background-color:#102a2b; color:#ffffff;">
              <p style="margin:0; color:#ffffff; font-size:30px; font-weight:700; letter-spacing:-1px;">SZLG<span style="color:#c98454;">+</span></p>
              <p style="margin:5px 0 0; color:#c8f0df; font-size:12px; font-weight:700; letter-spacing:2px;">KÖZPONTI FIÓKRENDSZER</p>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 40px 40px; color:#102a2b; font-size:16px; line-height:1.7;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 40px; background-color:#f3f5f1; border-top:1px solid #e5e7e3; color:#52615b; font-size:12px; line-height:1.5;">
              SZLG+ · Kőbányai Szent László Gimnázium
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
